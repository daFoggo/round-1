# Mô phỏng hệ thống chấm: /input read-only, kết quả ghi ra ./output/submission.csv
# OPENROUTER_API_KEY lấy từ file .env (docker compose tự đọc để thay biến).
services:
  grader:
    build:
      context: .
      platform: linux/amd64
    image: ai2026-tableqa
    mem_limit: 4g
    cpus: 6
    volumes:
      - ./data/p2/xlsx_files:/input/xlsx_files:ro
      - ./data/p2/queries.json:/input/queries.json:ro
      - ./output:/output
    command:
      - --xlsx-dir
      - /input/xlsx_files
      - --queries
      - /input/queries.json
      - --output
      - /output/submission.csv
      - --openrouter-key
      - ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      - --openrouter-model
      - qwen/qwen3.7-flash
      - --openrouter-base-url
      - https://openrouter.ai/api/v1
